<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verificado</title>
    <style>
        :root {
            --platform-50: #f8f9fa;
            --platform-100: #e9ecef;
            --platform-200: #dee2e6;
            --platform-300: #ced4da;
            --platform-400: #adb5bd;
            --platform-500: #6c757d;
            --platform-600: #495057;
            --platform-700: #343a40;
            --platform-800: #212529;
            --platform-900: #121416;
            --platform-950: #0a0b0c;

            --background: var(--platform-50);
            --foreground: var(--platform-800);
            --card-background: white;
            --card-foreground: var(--platform-800);
            --primary: var(--platform-500);
            --primary-foreground: white;
            --secondary: var(--platform-100);
            --secondary-foreground: var(--platform-800);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --background: var(--platform-950);
                --foreground: var(--platform-100);
                --card-background: var(--platform-900);
                --card-foreground: var(--platform-100);
                --primary: var(--platform-400);
                --primary-foreground: var(--platform-950);
                --secondary: var(--platform-800);
                --secondary-foreground: var(--platform-100);
            }
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: var(--background);
            color: var(--foreground);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: var(--card-background);
            color: var(--card-foreground);
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 2rem;
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        h1 {
            color: var(--primary);
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.5;
            margin-bottom: 1.5rem;
        }

        .icon {
            font-size: 4rem;
            color: var(--primary);
            margin-bottom: 1rem;
        }

        .userDetails-info {
            background-color: var(--secondary);
            color: var(--secondary-foreground);
            border-radius: 4px;
            padding: 1rem;
            margin-top: 1.5rem;
        }

        .userDetails-info p {
            margin: 0.5rem 0;
            font-size: 1rem;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             style="color: var(--primary);">
            <rect width="20" height="14" x="2" y="3" rx="2"></rect>
            <line x1="8" x2="16" y1="21" y2="21"></line>
            <line x1="12" x2="12" y1="17" y2="21"></line>
            <path d="m6 7 4 0"></path>
            <path d="m14 7 4 0"></path>
            <path d="m6 11 12 0"></path>
            <path d="m6 15 12 0"></path>
        </svg>
    </div>
    <h1>¡Email Verificado!</h1>
    <p>Gracias por verificar tu dirección de correo electrónico. Tu cuenta ha sido activada
        exitosamente.</p>
    <div class="userDetails-info">
        <p><strong>Nombre:</strong> <span th:text="${nombre}"></span></p>
        <p><strong>Email:</strong> <span th:text="${email}"></span></p>
    </div>
</div>
</body>
</html>
