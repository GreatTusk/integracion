<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Página no encontrada</title>
    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: #f5f7f2; /* vientos-50 */
            color: #252911; /* vientos-900 */
        }
        main {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            padding: 2rem 1rem;
            max-width: 1280px;
            margin: 0 auto;
        }
        .content {
            max-width: 640px;
            margin: 0 auto;
            text-align: center;
            display: flex;
            flex-direction: column;
        }
        h1 {
            margin-bottom: 1rem;
            font-size: 2.25rem;
            font-weight: 800;
            letter-spacing: -0.025em;
            color: #818C58; /* vientos-500 */
        }
        .icon {
            width: 4rem;
            height: 4rem;
            color: #6a7346; /* vientos-600 */
            margin: 0 auto 1rem;
        }
        .title {
            margin-bottom: 1rem;
            font-size: 1.875rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            color: #3c4223; /* vientos-800 */
        }
        .description {
            margin-bottom: 1rem;
            font-size: 1.125rem;
            font-weight: 300;
            color: #535a35; /* vientos-700 */
        }
        @media (min-width: 768px) {
            .container {
                padding: 4rem 1.5rem;
            }
            h1 {
                font-size: 8rem;
            }
            .title {
                font-size: 2.25rem;
            }
        }
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #252911; /* vientos-900 */
                color: #f5f7f2; /* vientos-50 */
            }
            h1 {
                color: #99b167; /* vientos-400 */
            }
            .icon {
                color: #cdd8b3; /* vientos-200 */
            }
            .title {
                color: #e6ebd9; /* vientos-100 */
            }
            .description {
                color: #b3c48d; /* vientos-300 */
            }
        }
    </style>
</head>
<body>
    <main>
        <div class="container">
            <div class="content">
                <h1>404</h1>
                <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M16 16s-1.5-2-4-2-4 2-4 2"></path>
                    <line x1="9" y1="9" x2="9.01" y2="9"></line>
                    <line x1="15" y1="9" x2="15.01" y2="9"></line>
                </svg>
                <p class="title">Algo falló.</p>
                <p class="description">Lo sentimos, no podemos encontrar esa página.</p>
            </div>
        </div>
    </main>
</body>
</html>
