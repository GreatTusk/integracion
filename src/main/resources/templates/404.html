<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Página no encontrada</title>
    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: #f8f9fa; /* platform-50 */
            color: #212529; /* platform-800 */
        }

        main {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            padding: 2rem 1rem;
            max-width: 1280px;
            margin: 0 auto;
        }

        .content {
            max-width: 640px;
            margin: 0 auto;
            text-align: center;
            display: flex;
            flex-direction: column;
        }

        h1 {
            margin-bottom: 1rem;
            font-size: 2.25rem;
            font-weight: 800;
            letter-spacing: -0.025em;
            color: #6c757d; /* platform-500 */
        }

        .icon {
            width: 4rem;
            height: 4rem;
            color: #495057; /* platform-600 */
            margin: 0 auto 1rem;
        }

        .title {
            margin-bottom: 1rem;
            font-size: 1.875rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            color: #343a40; /* platform-700 */
        }

        .description {
            margin-bottom: 1rem;
            font-size: 1.125rem;
            font-weight: 300;
            color: #495057; /* platform-600 */
        }

        @media (min-width: 768px) {
            .container {
                padding: 4rem 1.5rem;
            }

            h1 {
                font-size: 8rem;
            }

            .title {
                font-size: 2.25rem;
            }
        }

        @media (prefers-color-scheme: dark) {
            body {
                background-color: #121416; /* platform-900 */
                color: #f8f9fa; /* platform-50 */
            }

            h1 {
                color: #adb5bd; /* platform-400 */
            }

            .icon {
                color: #dee2e6; /* platform-200 */
            }

            .title {
                color: #e9ecef; /* platform-100 */
            }

            .description {
                color: #ced4da; /* platform-300 */
            }
        }
    </style>
</head>
<body>
<main>
    <div class="container">
        <div class="content">
            <h1>404</h1>
            <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="20" height="14" x="2" y="3" rx="2"></rect>
                <line x1="8" x2="16" y1="21" y2="21"></line>
                <line x1="12" x2="12" y1="17" y2="21"></line>
            </svg>
            <p class="title">Algo falló.</p>
            <p class="description">Lo sentimos, no podemos encontrar esa página.</p>
        </div>
    </div>
</main>
</body>
</html>
