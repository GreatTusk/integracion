<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Integración de Plataformas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: Arial, sans-serif;
            padding-top: 40px;
        }

        .auth-container {
            max-width: 500px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 40px;
        }

        .auth-icon {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .btn-primary {
            background-color: #6c757d;
            border-color: #6c757d;
            width: 100%;
            padding: 12px;
        }

        .btn-primary:hover {
            background-color: #5a6268;
            border-color: #5a6268;
        }

        .auth-footer {
            text-align: center;
            margin-top: 20px;
            color: #6c757d;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="auth-container">
        <div class="auth-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none"
                 stroke="#6c757d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="20" height="14" x="2" y="3" rx="2"></rect>
                <line x1="8" x2="16" y1="21" y2="21"></line>
                <line x1="12" x2="12" y1="17" y2="21"></line>
            </svg>
        </div>

        <h1 class="text-center mb-4" style="color: #6c757d;">Crear Cuenta</h1>

        <div th:if="${param.error}" class="alert alert-danger">
            <span th:text="${param.error}">Mensaje de error</span>
        </div>

        <form th:action="@{/api/v1/auth/register}" method="post">
            <div class="form-group">
                <label for="firstName">Nombre</label>
                <input type="text" class="form-control" id="firstName" name="firstName" required>
            </div>

            <div class="form-group">
                <label for="lastName">Apellido</label>
                <input type="text" class="form-control" id="lastName" name="lastName" required>
            </div>

            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" class="form-control" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirmar Contraseña</label>
                <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required>
            </div>

            <div class="form-group">
                <label for="role">Rol</label>
                <select class="form-control" id="role" name="role" required>
                    <option value="">Seleccionar Rol</option>
                    <optgroup label="Ventas">
                        <option value="ROLE_VENTAS_ADMIN">Administrador</option>
                        <option value="ROLE_VENTAS_USER">Usuario</option>
                    </optgroup>
                    <optgroup label="Proveedor">
                        <option value="ROLE_PROVEEDOR_ADMIN">Administrador</option>
                        <option value="ROLE_PROVEEDOR_ADQUISICION">Adquisición</option>
                        <option value="ROLE_PROVEEDOR_USER">Usuario</option>
                    </optgroup>
                    <optgroup label="Post Venta">
                        <option value="ROLE_POST_VENTA_ADMIN">Administrador</option>
                        <option value="ROLE_POST_VENTA_USER">Usuario</option>
                    </optgroup>
                    <optgroup label="Contabilidad">
                        <option value="ROLE_CONTABILIDAD_ADMIN">Administrador</option>
                        <option value="ROLE_CONTABILIDAD_USER">Usuario</option>
                    </optgroup>
                    <optgroup label="Despacho">
                        <option value="ROLE_DESPACHO_ADMIN">Administrador</option>
                        <option value="ROLE_DESPACHO_USER">Usuario</option>
                    </optgroup>
                    <optgroup label="Adquisición">
                        <option value="ROLE_ADQUISICION_ADMIN">Administrador</option>
                        <option value="ROLE_ADQUISICION_USER">Usuario</option>
                    </optgroup>
                    <optgroup label="Stock">
                        <option value="ROLE_STOCK_ADMIN">Administrador</option>
                        <option value="ROLE_STOCK_USER">Usuario</option>
                    </optgroup>
                    <optgroup label="Reportería">
                        <option value="ROLE_REPORTERIA_ADMIN">Administrador</option>
                        <option value="ROLE_REPORTERIA_USER">Usuario</option>
                    </optgroup>
                </select>
            </div>

            <!-- Hidden department field that will be set via JavaScript -->
            <input type="hidden" id="department" name="department" value="">

            <button type="submit" class="btn btn-primary">Registrar</button>
        </form>

        <div class="auth-footer">
            <p>¿Ya tienes una cuenta? <a th:href="@{/auth/login}">Inicia sesión aquí</a></p>
        </div>
    </div>
</div>

<script>
    document.getElementById('role').addEventListener('change', function () {
        const role = this.value;
        let department = '';

        if (role.includes('VENTAS')) {
            department = 'VENTAS';
        } else if (role.includes('PROVEEDOR')) {
            department = 'PROVEEDOR';
        } else if (role.includes('POST_VENTA')) {
            department = 'POST_VENTA';
        } else if (role.includes('CONTABILIDAD')) {
            department = 'CONTABILIDAD';
        } else if (role.includes('DESPACHO')) {
            department = 'DESPACHO';
        } else if (role.includes('ADQUISICION')) {
            department = 'ADQUISICION';
        } else if (role.includes('STOCK')) {
            department = 'STOCK';
        } else if (role.includes('REPORTERIA')) {
            department = 'REPORTERIA';
        }

        document.getElementById('department').value = department;
    });

    document.querySelector('form').addEventListener('submit', function (event) {
        if (!document.getElementById('department').value) {
            event.preventDefault();
            alert('Por favor selecciona un rol para continuar');
        }
    });
</script>
</body>
</html>
